id: sigma_cve_jetbrains_teamcity_2024_27199
name: JetBrains TeamCity Exploitation Attempt (CVE-2024-27199)
kind: sigma
severity: low
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /controller/
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2024-27199 in JetBrains TeamCity (CVSS 8.8, linked
  to ransomware campaigns). Demoted to low (alert-only): no product-specific URL has been published for
  this CVE (no verified source was available for a narrower TeamCity path), so the only observable is
  request rhythm on a generic path, and that matches ordinary application traffic. It is kept as a hunting
  signal and chain input, never as an auto-block trigger.'
references:
- https://blog.jetbrains.com/teamcity/2024/03/additional-critical-security-issues
