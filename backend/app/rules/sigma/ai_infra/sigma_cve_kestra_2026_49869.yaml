id: sigma_cve_kestra_2026_49869
name: Kestra Exploitation Attempt (CVE-2026-49869)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_regex: (?i)/api/v1/[^?]+/configs(\?|$)
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-49869 in Kestra (authentication bypass to RCE).
  Kestra's AuthenticationFilter whitelists any API path whose last segment is 'configs', so the exploit
  requests look like /api/v1/main/flows/<flow>/configs. The legitimate public endpoint /api/v1/configs
  has no segment between /api/v1/ and /configs and is not matched. Ten or more such requests from one
  source in five minutes is automated bypass use. Previously matched any path containing /configs.
references:
- https://github.com/kestra-io/kestra/security/advisories/GHSA-5vc5-wxxq-3fjx
- https://nvd.nist.gov/vuln/detail/CVE-2026-49869
